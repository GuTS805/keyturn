[package]
name = "keyturn-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stateless worker that publishes a staged package only if it matches the approved hash"

[lib]
name = "keyturn_worker"
path = "src/lib.rs"

[[bin]]
name = "keyturn-worker"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
data-encoding = "2"
flate2 = "1"
tar = "0.4"
ureq = { version = "2", optional = true }
rsa = { version = "0.9", features = ["sha2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tar = "0.4"
flate2 = "1"
rand = "0.8"

# Key generation in tests is slow without optimisation.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

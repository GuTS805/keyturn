<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyturn</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1c1c1a; --muted: #6b6b66; --line: #dcdcd4; --card: #ffffff;
    --ok: #1e7a45; --bad: #b3261e; --warn: #8a5a00; --accent: #20324a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141412; --fg: #eeeee8; --muted: #9a9a92; --line: #33332f; --card: #1c1c19;
      --ok: #5cc98a; --bad: #ff8a80; --warn: #e0b45a; --accent: #9db8da; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 24px; }
  form .wide { grid-column: 1 / -1; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--fg); font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg);
    font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .status { font-size: 1.25rem; font-weight: 600; margin: 0 0 4px; }
  .meaning { color: var(--muted); margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: 8.5rem 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  code { font: .85rem ui-monospace, SFMono-Regular, Consolas, monospace; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .tick { display: inline-block; width: 1.1em; }
  .error { color: var(--bad); }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } dl { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Keyturn</h1>
  <p class="lead">Check a release against the contract. This page only reads the chain and holds no keys.</p>

  <form id="form">
    <div class="wide"><label for="contract">Contract</label>
      <input id="contract" type="text" value="contract.hudich-keyturn.testnet" autocomplete="off"></div>
    <div><label for="project">Project</label>
      <input id="project" type="text" placeholder="npm:name or chrome:extension-id" autocomplete="off"></div>
    <div><label for="version">Version</label>
      <input id="version" type="text" placeholder="1.0.0" autocomplete="off"></div>
    <div class="wide"><button type="submit">Look up</button></div>
  </form>

  <div id="out" aria-live="polite"></div>

  <div class="card" id="fileCard" hidden>
    <h2>Check a file against the approved hash</h2>
    <p class="meaning">Choose the package you downloaded (the .tgz for npm, or the extension ZIP). It is hashed in your browser and never uploaded.</p>
    <input id="file" type="file" aria-label="Package file">
    <p id="fileResult" aria-live="polite"></p>
  </div>
</main>

<script type="module">
import { RPC, rpcView, summarize, sha256Hex, formatDuration } from './keyturn.js';

const $ = (id) => document.getElementById(id);
let approvedHash = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function show(summary) {
  if (!summary.found) return `<div class="card"><p class="error">${esc(summary.message)}</p></div>`;
  if (!summary.status) return `<div class="card"><p>${esc(summary.message)}</p></div>`;
  const cls = { Released: 'ok', Rejected: 'bad', Recalled: 'bad', Flagged: 'warn' }[summary.status] || '';
  const approvals = summary.members
    .map((m) => `<div><span class="tick ${summary.approvals.includes(m) ? 'ok' : ''}">${summary.approvals.includes(m) ? '✓' : '·'}</span>${esc(m)}</div>`)
    .join('');
  const rows = [
    ['Approvals', `${summary.approvals.length} of ${summary.needed} needed<br>${approvals}`],
    ['Proposed by', esc(summary.proposer)],
    ['Approved hash', `<code>${esc(summary.hash)}</code>`],
  ];
  if (summary.windowOpen) rows.splice(1, 0, ['Window', `${esc(formatDuration(summary.windowRemainingMs))} left to flag it`]);
  if (summary.flag) rows.push(['Flag', `${esc(summary.flag.by)}: ${esc(summary.flag.reason)}`]);
  return `<div class="card"><p class="status ${cls}">${esc(summary.status)}</p><p class="meaning">${esc(summary.meaning)}</p>
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const contract = $('contract').value.trim();
  const project = $('project').value.trim();
  const version = $('version').value.trim();
  const out = $('out');
  $('fileCard').hidden = true;
  approvedHash = null;
  if (!contract || !project) { out.innerHTML = '<div class="card"><p class="error">Give a contract and a project.</p></div>'; return; }
  out.innerHTML = '<div class="card"><p>Looking up…</p></div>';
  try {
    const net = contract.endsWith('.near') ? 'mainnet' : 'testnet';
    const proj = await rpcView({ rpc: RPC[net], contract, method: 'get_project', args: { project_id: project } });
    const rel = version ? await rpcView({ rpc: RPC[net], contract, method: 'get_release', args: { project_id: project, version } }) : null;
    const summary = proj && !version ? { found: true, message: 'Give a version to see its release.' } : summarize(proj, rel);
    out.innerHTML = show(summary);
    if (summary.hash) { approvedHash = summary.hash; $('fileCard').hidden = false; $('fileResult').textContent = ''; }
  } catch (err) {
    out.innerHTML = `<div class="card"><p class="error">${esc(err.message || err)}</p></div>`;
  }
});

// A link like ?project=npm:name&version=1.0.0 runs the lookup straight away.
const params = new URLSearchParams(location.search);
if (params.get('contract')) $('contract').value = params.get('contract');
if (params.get('project')) {
  $('project').value = params.get('project');
  $('version').value = params.get('version') || '';
  $('form').requestSubmit();
}

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f || !approvedHash) return;
  const hash = await sha256Hex(await f.arrayBuffer());
  const r = $('fileResult');
  const match = hash === approvedHash;
  r.className = match ? 'ok' : 'bad';
  r.textContent = match
    ? 'Match. This file is exactly what the quorum approved.'
    : `Different. This file hashes to ${hash}, but the quorum approved ${approvedHash}.`;
});
</script>
</body>
</html>
